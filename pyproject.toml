[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apearchivesextractor"
version = "1.0.3"
description = "A small cross-platform archive manager with CLI and PySide6 GUI."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "src/apearchivesextractor/legal/NOTICE.txt"]
requires-python = ">=3.11"
authors = [
  { name = "Gianca" }
]
dependencies = [
  "packaging>=23.2",
  "py7zr>=1.0.0",
  "multivolumefile>=0.2.3",
  "PySide6-Essentials>=6.7.0",
  "rarfile>=4.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
package = [
  "pyinstaller>=6.0.0"
]

[project.scripts]
ape-arch = "apearchivesextractor.cli:main"
apearchivesextractor = "apearchivesextractor.cli:main"
apearchivesextractor-gui = "apearchivesextractor.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apearchivesextractor = ["assets/*.svg", "assets/*.ico", "assets/*.icns", "legal/*.txt", "legal/*.md"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
