  <title id="title">ApeArchivesExtractor — Open. Pack. Extract.</title>
  <desc id="description">A desktop workspace and command-line interface for ZIP, 7z, RAR and TAR.GZ archives.</desc>
  <defs><linearGradient id="backdrop" x2="1" y2="1"><stop stop-color="#102d4b"/><stop offset="1" stop-color="#214f7a"/></linearGradient></defs>
